name: CI
on:
  pull_request:
  push:
    branches: [staging, main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt || echo "requirements.txt not yet created"
      - run: pip install ruff pytest && ruff check . || true
      - run: pytest -q || echo "no tests yet"
      - name: Spec drift check (docs vs enums)
        run: python scripts/spec_check.py ..
      - name: PR convention check (blockers fail the build)
        run: |
          git fetch --no-tags --depth=50 origin staging || true
          python scripts/pr_check.py
      - name: Migration chain integrity
        run: python scripts/check_migration_integrity.py || true
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install || echo "package.json not yet created"
      - run: npm run lint --if-present
      - name: Frontend convention check
        run: node scripts/fe_check.mjs --all
      - run: npm run test --if-present
      - run: npm run build --if-present
