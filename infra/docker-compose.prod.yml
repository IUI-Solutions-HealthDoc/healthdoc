name: healthdoc-prod

x-restart: &restart {restart: unless-stopped}

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    <<: *restart
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}"]
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD:?required}"}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?required}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      POSTGRES_DB: keycloak
    volumes: [keycloak-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  realm-init:
    image: python:3.12-alpine
    environment: {PUBLIC_BASE_URL: "https://${PUBLIC_HOST:?required}"}
    command: ["python", "/tools/render_keycloak_realm.py", "/source/realm-healthdoc.json", "/import/realm-healthdoc.json", "--public-base-url", "https://${PUBLIC_HOST:?required}"]
    volumes:
      - ./keycloak/realm-healthdoc.json:/source/realm-healthdoc.json:ro
      - ../scripts/deploy/render_keycloak_realm.py:/tools/render_keycloak_realm.py:ro
      - keycloak-import:/import

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:25.0
    command: ["start", "--import-realm", "--http-enabled=true", "--http-relative-path=/auth"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_HOSTNAME: https://${PUBLIC_HOST:?required}/auth
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
    volumes:
      - keycloak-import:/opt/keycloak/data/import:ro
      - ./keycloak/themes/healthdoc:/opt/keycloak/themes/healthdoc:ro
    depends_on:
      keycloak-db: {condition: service_healthy}
      realm-init: {condition: service_completed_successfully}

  minio:
    <<: *restart
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    entrypoint: ["/bin/sh", "/init/init-buckets.sh"]
    volumes: [./minio/init-buckets.sh:/init/init-buckets.sh:ro]
    depends_on: {minio: {condition: service_started}}

  migrate:
    image: ${HEALTHDOC_BACKEND_IMAGE:?required}
    build: {context: ../backend, target: prod}
    env_file: ../${HEALTHDOC_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}

  backend:
    <<: *restart
    image: ${HEALTHDOC_BACKEND_IMAGE:?required}
    build: {context: ../backend, target: prod}
    env_file: ../${HEALTHDOC_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/healthdoc?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_ISSUER: https://${PUBLIC_HOST}/auth/realms/healthdoc
      JWT_JWKS_URL: http://keycloak:8080/auth/realms/healthdoc/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      MINIO_ENDPOINT: minio:9000
      CORS_ORIGINS: https://${PUBLIC_HOST}
      DATA_ACCESS_LOG_FALLBACK_PATH: /var/log/healthdoc/data_access_log_fallback.jsonl
    volumes: [audit-fallback-data:/var/log/healthdoc]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_started}
      minio-init: {condition: service_completed_successfully}

  frontend:
    <<: *restart
    image: ${HEALTHDOC_FRONTEND_IMAGE:?required}
    build:
      context: ../frontend
      target: prod
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${PUBLIC_HOST}/api/v1
        NEXT_PUBLIC_KEYCLOAK_URL: https://${PUBLIC_HOST}/auth
    depends_on: {backend: {condition: service_started}}

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on: {backend: {condition: service_started}}

  grafana:
    <<: *restart
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    depends_on: {prometheus: {condition: service_started}}

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod-conf.d:/etc/nginx/conf.d:ro
      - ${TLS_CERT_PATH:?required}:/etc/nginx/certs/tls.crt:ro
      - ${TLS_KEY_PATH:?required}:/etc/nginx/certs/tls.key:ro
    ports: ["80:80", "443:443"]
    depends_on:
      backend: {condition: service_started}
      frontend: {condition: service_started}
      keycloak: {condition: service_started}

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  keycloak-data:
  keycloak-import:
  minio-data:
  audit-fallback-data:
  prometheus-data:
  grafana-data:
