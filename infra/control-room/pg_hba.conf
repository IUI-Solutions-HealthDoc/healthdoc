# Hospital server PostgreSQL (infra/docker-compose.prod.yml).
#
# The image's own rules, except that the control-room role, which connects
# from another machine across the private network, must use TLS and is
# refused without it. First match wins, so the control-room lines come first.

# TYPE     DATABASE  USER                    ADDRESS       METHOD
local      all       all                                   trust
hostnossl  all       healthdoc_control_room  all           reject
hostssl    all       healthdoc_control_room  all           scram-sha-256
host       all       all                     127.0.0.1/32  trust
host       all       all                     ::1/128       trust
local      replication all                                 trust
host       all       all                     all           scram-sha-256
