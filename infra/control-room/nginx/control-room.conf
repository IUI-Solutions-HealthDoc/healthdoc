# Control-room server (docs/control-room-design-2026-10-10.md, "Deployment").
# Its own address, like BHAVYA's command centre (dashboard-1.*) beside its HIMS
# (hims.*). Serves the control-room screen, its API, and the healthdoc-control
# realm's login. Nothing else: no staff realm, no Keycloak admin console, no
# hospital route. Keycloak itself stays central; this host proxies only the
# control realm to it over the private network.

upstream control_room_api { server control-room-api:8000; }
upstream control_room_frontend { server control-room-frontend:3000; }

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # The control-room API serves only its own routes (API_MODE=control_room);
    # anything else is already a 404 there. Not reachable: /metrics.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://control_room_api;
    }

    # The control realm only. The staff realm (/auth/realms/healthdoc/) and the
    # admin console are not proxied, so they do not exist at this address.
    location /auth/realms/healthdoc-control/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass ${KEYCLOAK_UPSTREAM}/auth/realms/healthdoc-control/;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Login-page theme assets (GET/HEAD only).
    location /auth/resources/ {
        limit_except GET HEAD { deny all; }
        proxy_pass ${KEYCLOAK_UPSTREAM}/auth/resources/;
    }
    location /auth/ { return 404; }

    location = /silent-check-sso.html {
        proxy_pass http://control_room_frontend;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; frame-ancestors 'self'" always;
    }

    # The screen: the control room, the sign-in page, and the app's own assets.
    location ~ ^/(monitor|login|_next|healthdoc-logo\.png|manifest\.webmanifest)(/|$) {
        proxy_pass http://control_room_frontend;
    }
    location = / { return 302 /monitor; }
    location / { return 404; }
}
