upstream backend { server backend:8000; }
upstream frontend { server frontend:3000; }
upstream keycloak { server keycloak:8080; }

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    # CSP for the Next app is issued per-request with a script nonce in
    # frontend/src/proxy.ts (WASA M3). A second nginx CSP with unsafe-inline
    # would still fail scanners and conflict with the nonce policy.

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://keycloak;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'" always;
    }

    location = /silent-check-sso.html {
        proxy_pass http://frontend;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Hash of <script>parent.postMessage(location.href, location.origin);</script>
        # in frontend/public/silent-check-sso.html — recompute if that body changes.
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-NuGEHWbQP7fFayUad46pwOQjhf59O6x6VUaef+Cctms='; frame-ancestors 'self'" always;
    }

    location / {
        proxy_pass http://frontend;
    }
}
