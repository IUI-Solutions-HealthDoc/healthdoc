# Dev certs: run infra/nginx/generate-dev-certs.sh once.
# Prod: replace with real certs (Let's Encrypt / hospital CA) — same paths.

upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }
upstream keycloak { server keycloak:8080; }

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    # TLS 1.3 only (B1-W1-03). Add TLSv1.2 only if legacy clients require it.
    ssl_protocols TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    # NO Content-Security-Policy here (WASA M3). It is set per request in
    # frontend/src/proxy.ts, because the script-src now carries a per-response
    # nonce instead of 'unsafe-inline' and nginx can only send a fixed string.
    # Adding one back here would not override that policy — a second CSP header
    # is enforced as the INTERSECTION of the two — so a well-meant "defence in
    # depth" line would silently block the nonced bootstrap and white-screen
    # every page. The two policies below are for upstreams Next does not render:
    # /auth/ is Keycloak, and /silent-check-sso.html is excluded in proxy.ts.

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # FastAPI
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend;
        # SSE endpoints share this prefix with JSON APIs. Buffering keeps the
        # upstream stream alive after a browser tab closes, so Uvicorn reloads
        # wait forever for "background tasks" and the whole API stops serving.
        # Production already disables it; development must exercise the same
        # disconnect semantics.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Keycloak (mounted at /auth via --http-relative-path)
    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://keycloak;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;

        # keycloak-js checks browser cookie support with a same-origin hidden
        # iframe before it exchanges the PKCE code. Inheriting DENY and
        # frame-ancestors 'none' here aborts that exchange after credentials
        # succeed and sends the app back to /login.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'" always;
    }

    # Queue-display websockets + Next.js HMR
    location /_next/webpack-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # Next 16/Turbopack uses /_next/hmr instead of webpack-hmr.
    location /_next/hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /api/v1/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Keycloak's check-sso flow embeds this same-origin helper in a hidden
    # iframe. The server-wide DENY/frame-ancestors policy is correct for every
    # application screen, but applying it here makes silent SSO impossible.
    # A location-level add_header set replaces the inherited set, so this one
    # narrowly allows only same-origin framing while retaining the other
    # security headers that matter for the static helper.
    location = /silent-check-sso.html {
        proxy_pass http://frontend;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; frame-ancestors 'self'" always;
    }

    # Next.js
    location / {
        proxy_pass http://frontend;
    }
}
