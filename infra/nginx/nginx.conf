# HealthDoc edge proxy — issue B1-W1-03 (TLS 1.3 + security headers)
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Body size: file uploads (files module) go through backend
    client_max_body_size 25m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Rate limiting — tune per-route in conf.d
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # A cold Keycloak theme requests fonts, JS, CSS and images in parallel.
    # Charging those against the credential bucket rejected real login POSTs
    # with 503 during sequential browser tests. Only read-only theme resources
    # are exempt; every credential/token request keeps its original limit.
    # $uri is normalized by nginx (not a caller-supplied query string).
    # Empty keys are not counted: https://nginx.org/en/docs/http/ngx_http_limit_req_module.html#limit_req_zone
    map "$request_method:$uri" $healthdoc_auth_limit_key {
        default $binary_remote_addr;
        ~^(GET|HEAD):/auth/resources/ "";
    }
    limit_req_zone $healthdoc_auth_limit_key zone=auth:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
