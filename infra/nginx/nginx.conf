# HealthDoc edge proxy — issue B1-W1-03 (TLS 1.3 + security headers)
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    # Variable-path access logs check the request root even for proxy_pass.
    # The image ships this directory, not the compiled /etc/nginx/html default.
    root /usr/share/nginx/html;

    # Body size: file uploads (files module) go through backend
    client_max_body_size 25m;

    map $http_cf_connecting_ip $healthdoc_cf_ip_claim {
        default invalid;
        "" "";
        "~^[0-9a-fA-F:.]{1,45}$" $http_cf_connecting_ip;
    }
    map $http_x_forwarded_for $healthdoc_xff_claim {
        default invalid;
        "" "";
        "~^[0-9a-fA-F:., ]{1,512}$" $http_x_forwarded_for;
    }

    # Forwarded values are untrusted attribution CLAIMS, never auth decisions.
    # Exclude queries/referrers: OAuth codes and patient search terms can occur there.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "-" "$http_user_agent" '
                    'rt=$request_time cf_connecting_ip_claim="$healthdoc_cf_ip_claim" '
                    'xff_claim="$healthdoc_xff_claim" receipt="$sent_http_x_healthdoc_receipt_id"';
    access_log /var/log/nginx/access.log main;
    map $time_iso8601 $healthdoc_log_day {
        ~^(?<healthdoc_day>[0-9-]+)T $healthdoc_day;
        default unknown;
    }
    # Named volume, not the image's /dev/stdout symlink. Daily files allow
    # retention without copytruncate races or stopping a live callback.
    access_log /var/log/healthdoc/access-$healthdoc_log_day.log main;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Rate limiting — tune per-route in conf.d
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # A cold Keycloak theme requests fonts, JS, CSS and images in parallel.
    # Charging those against the credential bucket rejected real login POSTs
    # with 503 during sequential browser tests. The two static cookie-support
    # iframe pages also load before each silent SSO and used the same bucket,
    # refusing both the probe and later token exchanges. Only GET/HEAD theme
    # resources and those exact probe pages are exempt; every credential/token
    # request keeps its original limit. Do not exempt the realm/OIDC prefix.
    # $uri is normalized by nginx (not a caller-supplied query string).
    # Empty keys are not counted: https://nginx.org/en/docs/http/ngx_http_limit_req_module.html#limit_req_zone
    map "$request_method:$uri" $healthdoc_auth_limit_key {
        default $binary_remote_addr;
        ~^(GET|HEAD):/auth/resources/ "";
        ~^(GET|HEAD):/auth/realms/[^/]+/protocol/openid-connect/3p-cookies/step[12]\.html$ "";
    }
    limit_req_zone $healthdoc_auth_limit_key zone=auth:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
