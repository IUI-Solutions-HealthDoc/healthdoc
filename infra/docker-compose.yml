# HealthDoc dev stack — issue B1-W1-02
# Usage: from repo root:  make up   (or: docker compose -f infra/docker-compose.yml --env-file .env up -d)
name: healthdoc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ../infra/keycloak/realm-healthdoc.json:/opt/keycloak/data/import/realm-healthdoc.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_FILES: ${MINIO_BUCKET_FILES:-hd-files}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-hd-reports}
    entrypoint: ["/bin/sh", "/init/init-buckets.sh"]
    volumes:
      - ../infra/minio/init-buckets.sh:/init/init-buckets.sh:ro

  orthanc:
    image: orthancteam/orthanc:latest
    environment:
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USER}": "${ORTHANC_PASSWORD}"}'
    volumes:
      - ../infra/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db
    ports:
      - "127.0.0.1:${ORTHANC_PORT:-8042}:8042"   # REST/UI
      - "127.0.0.1:${ORTHANC_DICOM_PORT:-4242}:4242"   # DICOM

  icd11:
    # WHO ICD-11 API, self-hosted — offline coding at the facility edge.
    # First pull is large (several GB); dev machines can comment this out and
    # set ICD11_BASE_URL to the WHO cloud API instead.
    image: whoicd/icd-api:latest
    environment:
      acceptLicense: "true"
      saveAnalytics: "false"
    ports:
      - "127.0.0.1:${ICD11_PORT:-8083}:80"

  backend:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/code
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ../frontend
      target: dev
    env_file: ../.env
    volumes:
      - ../frontend:/code
      - /code/node_modules
      - /code/.next
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
      - keycloak
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  minio-data:
  orthanc-data:
